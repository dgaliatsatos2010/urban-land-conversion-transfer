name: Reproduce and publish 30-repeat permutation results
on:
  workflow_dispatch:
  push:
    paths:
      - 'Reviewer2_Analyses/reproduce_permutation_30.py'
      - '.github/workflows/reproduce-permutation.yml'
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 geopandas==1.1.2 shapely==2.1.2 matplotlib==3.10.8
      - name: Compute all 360 permutation results and verify replay
        run: python Reviewer2_Analyses/reproduce_permutation_30.py
      - name: Publish verified machine-readable results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Reviewer2_Results/xgboost_permutation_30_full.csv Reviewer2_Results/xgboost_permutation_30_summary.csv Reviewer2_Results/xgboost_permutation_model_replay_checks.csv
          git diff --cached --quiet || (git commit -m "Publish verified 360 XGBoost permutation results" && git push)
