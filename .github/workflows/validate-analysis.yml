name: Validate archived urban analysis
on:
  workflow_dispatch:
  push:
    paths:
      - 'Original_Analysis/qa_integrity_v08.py'
      - '.github/workflows/validate-analysis.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 geopandas==1.1.2 shapely==2.1.2 matplotlib==3.10.8
      - name: Verify archived data, 15 metric rows, and original bundle checksums
        run: python Original_Analysis/qa_integrity_v08.py
      - name: Recompute all 360 held-out permutations
        run: python Reviewer2_Analyses/reproduce_permutation_30.py
