name: Validate archived urban analysis
on:
  workflow_dispatch:
  push:
    paths:
      - 'Original_Analysis/qa_integrity_v08.py'
      - 'Reviewer2_Analyses/reproduce_permutation_30.py'
      - '.github/workflows/validate-analysis.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Original_Analysis/requirements.txt'
      - name: Install reproducibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 xgboost==3.1.3 geopandas==1.1.2 shapely==2.1.2 matplotlib==3.10.8
          python -m pip check
      - name: Verify original dataset, 15 metric rows and bundle checksums
        run: python Original_Analysis/qa_integrity_v08.py
      - name: Recompute all 360 held-out permutations
        run: python Reviewer2_Analyses/reproduce_permutation_30.py
      - name: Compare generated permutation CSVs with published results
        run: |
          git diff --exit-code -- Reviewer2_Results/xgboost_permutation_30_full.csv Reviewer2_Results/xgboost_permutation_30_summary.csv Reviewer2_Results/xgboost_permutation_model_replay_checks.csv
      - name: Archive audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-analysis-clean-run
          path: |
            Reviewer2_Results/xgboost_permutation_30_full.csv
            Reviewer2_Results/xgboost_permutation_30_summary.csv
            Reviewer2_Results/xgboost_permutation_model_replay_checks.csv
          if-no-files-found: warn
